name: Validate and publish
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: feedback-hub-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    env:
      HAS_DISPATCH_TOKEN: ${{ secrets.HOMELAB_DISPATCH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix develop --command cargo fmt -- --check
      - run: nix develop --command cargo clippy --all-targets -- -D warnings
      - run: nix develop --command cargo test
      - run: nix develop --command bash -c 'cd web && npm ci && npm run typecheck && npm run build'
      - run: nix develop --command bash -c 'cargo build && cd web && npm run e2e'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: web/test-results/
      - run: nix build .#container --out-link result-container
      - name: Publish container
        id: publish
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker load -i result-container
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag ghcr.io/fruitiex/feedback-hub:main ghcr.io/fruitiex/feedback-hub:${{ github.sha }}
          docker push ghcr.io/fruitiex/feedback-hub:main
          docker push ghcr.io/fruitiex/feedback-hub:${{ github.sha }}
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/fruitiex/feedback-hub:main | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy to homelab
        if: steps.publish.outputs.digest != '' && env.HAS_DISPATCH_TOKEN == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.HOMELAB_DISPATCH_TOKEN }}
          repository: FruitieX/homelab
          event-type: image-update
          client-payload: |
            {"image": "ghcr.io/fruitiex/feedback-hub", "digest": "${{ steps.publish.outputs.digest }}"}
